# 클라이언트 IP별 REST API 요청 속도를 초당 10개 수준으로 제한합니다.
limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;

server {
    # 컨테이너 내부에서는 80포트를 사용하고 compose.yaml에서 외부 포트와 연결합니다.
    listen 80;
    server_tokens off;

    # Vite가 빌드한 정적 파일 위치입니다.
    root /usr/share/nginx/html;
    client_max_body_size 16k;

    # 브라우저 보안을 위한 공통 응답 헤더입니다.
    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'self'; connect-src 'self' ws: wss:; frame-ancestors 'none'" always;

    # /api/ 요청은 FastAPI 컨테이너의 8000포트로 전달합니다.
    location /api/ {
        limit_req zone=api burst=30 nodelay;
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # WebSocket은 HTTP Upgrade 헤더를 전달해야 일반 프록시가 아닌 지속 연결로 전환됩니다.
    location /ws/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 30s;
    }

    # Vue가 직접 URL 라우팅을 하지 않더라도 존재하지 않는 정적 경로는 index.html로 돌립니다.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
