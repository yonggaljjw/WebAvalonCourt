# Docker Compose 하나로 MySQL → FastAPI → Nginx(Vue) 세 서비스를 함께 실행합니다.
services:
  # ---------------------------------------------------------------------------
  # 1. 데이터베이스
  # ---------------------------------------------------------------------------
  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      # ${VAR:?메시지} 문법은 필수 환경변수가 없을 때 Compose 실행을 즉시 실패시킵니다.
      MYSQL_DATABASE: ${MYSQL_DATABASE:?Run python scripts/init_env.py}
      MYSQL_USER: ${MYSQL_USER:?Missing MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Missing MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Missing MYSQL_ROOT_PASSWORD}
    volumes:
      # 컨테이너를 다시 만들어도 DB 파일은 named volume에 남습니다.
      - mysql_data:/var/lib/mysql
    healthcheck:
      # 단순히 프로세스가 떴는지가 아니라 실제 SELECT가 가능한지 확인합니다.
      test: ["CMD-SHELL", "MYSQL_PWD=$$MYSQL_PASSWORD mysql -h 127.0.0.1 -u$$MYSQL_USER $$MYSQL_DATABASE -e 'SELECT 1'"]
      interval: 5s
      timeout: 5s
      retries: 30
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]

  # ---------------------------------------------------------------------------
  # 2. FastAPI 백엔드
  # ---------------------------------------------------------------------------
  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      APP_SECRET: ${APP_SECRET:?Missing APP_SECRET}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
    depends_on:
      # MySQL 컨테이너 생성이 아니라 healthcheck 성공 이후 백엔드를 시작합니다.
      db:
        condition: service_healthy
    healthcheck:
      # FastAPI 자체뿐 아니라 /api/health 내부의 DB SELECT까지 확인합니다.
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ---------------------------------------------------------------------------
  # 3. Nginx + 빌드된 Vue 프론트엔드
  # ---------------------------------------------------------------------------
  web:
    build: ./frontend
    restart: unless-stopped
    ports:
      # 호스트의 WEB_PORT(기본 8080)를 컨테이너 Nginx의 80포트에 연결합니다.
      - "${WEB_PORT:-8080}:80"
    depends_on:
      backend:
        condition: service_healthy

  # cloudflared:
  #   image: cloudflare/cloudflared:latest
  #   restart: unless-stopped

  #   # Cloudflare와 Tunnel 연결을 시작합니다.
  #   command: tunnel --no-autoupdate run

  #   environment:
  #     # Cloudflare Dashboard에서 발급받은 Tunnel Token
  #     TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:?Missing CLOUDFLARE_TUNNEL_TOKEN}

  #   # web이 생성된 뒤 cloudflared를 실행합니다.
  #   depends_on:
  #     - web

# Docker가 관리하는 MySQL 영속 볼륨을 선언합니다.
volumes:
  mysql_data: